<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080, user-scalable=no">
<title>Nocturne</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="theme-midnight">
<div id="stage">
  <div id="bg"></div>
  <div id="glow"></div>

  <header id="top">
    <div>
      <div id="clock">--:--</div>
      <div id="date"></div>
      <div id="location">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
        <span id="location-name"></span>
      </div>
    </div>
    <div id="brand">nocturne<span id="mode-badge"></span></div>
  </header>

  <main id="viewport">
    <div id="rows"></div>
  </main>

  <footer id="hints">
    <span><b class="k">OK</b> Open</span>
    <span><b class="k red"></b> Pin / unpin</span>
    <span><b class="k green"></b> Reorder pins</span>
    <span><b class="k yellow"></b> Background</span>
    <span><b class="k blue"></b> Theme</span>
    <span><b class="k">BACK</b> Exit</span>
  </footer>

  <div id="toast"></div>
</div>
<script src="js/settings.js"></script>
<script src="js/apps.js"></script>
<script src="backgrounds/backgrounds.js"></script>
<script src="js/main.js"></script>
</body>
</html>

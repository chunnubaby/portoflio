<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080, user-scalable=no">
<title>Nocturne</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="theme-midnight">
<div id="stage">
  <div id="bg"></div>
  <div id="glow"></div>

  <header id="top">
    <div>
      <div id="clock">--:--</div>
      <div id="date"></div>
    </div>
    <div id="brand">nocturne<span id="mode-badge"></span></div>
  </header>

  <main id="viewport">
    <div id="rows"></div>
  </main>

  <footer id="hints">
    <span><b class="k">OK</b> Open</span>
    <span><b class="k red"></b> Pin / unpin</span>
    <span><b class="k green"></b> Reorder pins</span>
    <span><b class="k yellow"></b> Background</span>
    <span><b class="k blue"></b> Theme</span>
    <span><b class="k">BACK</b> Exit</span>
  </footer>

  <div id="toast"></div>
</div>
<script src="js/apps.js"></script>
<script src="backgrounds/backgrounds.js"></script>
<script src="js/main.js"></script>
</body>
</html>
